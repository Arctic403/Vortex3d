plugins {
    id "com.android.application"
}

android {
    namespace "com.vortex3d.app"
    compileSdk 35

    defaultConfig {
        applicationId "com.vortex3d.app"
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName "0.3.0"

        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a"
        }
        externalNativeBuild {
            cmake {
                cppFlags "-std=c++20"
                arguments "-DVORTEX_BUILD_TESTS=OFF", "-DVORTEX_BUILD_BENCHMARKS=OFF", "-DVORTEX_WARNINGS_AS_ERRORS=ON"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }
}
