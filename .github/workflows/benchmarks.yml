name: Performance Benchmarks

on:
  workflow_dispatch:
    inputs:
      scale:
        description: Requested benchmark element scale
        required: true
        default: '10000'
        type: choice
        options:
          - '10000'
          - '100000'
          - '1000000'

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure Release benchmark
        run: >-
          cmake -S . -B build-bench
          -DCMAKE_BUILD_TYPE=Release
          -DVORTEX_BUILD_TESTS=OFF
          -DVORTEX_BUILD_BENCHMARKS=ON
          -DVORTEX_WARNINGS_AS_ERRORS=ON
      - name: Build benchmark
        run: cmake --build build-bench --target vortex_mesh_bench --parallel
      - name: Run benchmark
        run: ./build-bench/vortex_mesh_bench --scale ${{ inputs.scale }} --output benchmark-${{ inputs.scale }}.json
      - name: Show results
        run: cat benchmark-${{ inputs.scale }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: vortex-benchmark-${{ inputs.scale }}-${{ github.sha }}
          path: benchmark-${{ inputs.scale }}.json
          retention-days: 30
